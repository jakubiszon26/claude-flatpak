id: com.anthropic.Claude
branch: stable
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: claude-desktop
finish-args:
  - --filesystem=host
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  - --metadata=Extra Data=NoRuntime=false
modules:
  - name: launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 launcher /app/bin/claude-desktop
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm644 com.anthropic.Claude.desktop /app/share/applications/com.anthropic.Claude.desktop
    sources:
      - type: file
        path: launcher
      - type: file
        path: apply_extra
      - type: file
        path: com.anthropic.Claude.desktop
